spring.application.name=backendpetsalud

# ===== Base de datos (MySQL) =====
# Las credenciales se leen de variables de entorno; los valores después de ":" son solo para desarrollo local.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/petsalud_db?createDatabaseIfNotExist=true&serverTimezone=UTC}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
# No mostrar SQL en consola (puede filtrar datos personales en los logs)
spring.jpa.show-sql=false

# ===== JWT =====
# Clave HMAC de 256 bits en Base64. EN PRODUCCIÓN definir la variable de entorno JWT_SECRET
# (generar con: openssl rand -base64 32). El valor por defecto es SOLO para desarrollo.
jwt.secret=${JWT_SECRET:cGV0c2FsdWQtZGV2LXNlY3JldC1rZXktY2FtYmlhci1lbi1wcm9kdWNjaW9uLTIwMjQ=}
# Duración del token: 1 hora
jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}
jwt.issuer=petsalud-backend

# ===== Monitoreo / anti fuerza bruta =====
security.login.max-intentos=5
security.login.bloqueo-segundos=900
security.cors.allowed-origins=${CORS_ORIGINS:http://localhost:3000}

# ===== Errores: no exponer detalles internos al cliente =====
server.error.include-stacktrace=never
server.error.include-message=never

# ===== Usuarios de prueba (desactivar en producción) =====
app.seed.enabled=${APP_SEED:true}
app.seed.password=Petsalud2024

# ===== Log de auditoría de seguridad =====
logging.level.SECURITY_AUDIT=INFO
logging.file.name=logs/petsalud.log
